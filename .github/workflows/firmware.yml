name: Build CommonIOT Firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: GitHub Release 版本号，例如 v0.1.0
        required: true
        default: v0.1.0
        type: string
      prerelease:
        description: 是否作为预发布版本
        required: true
        default: true
        type: boolean
      platform:
        description: 选择要编译的平台
        required: true
        default: all
        type: choice
        options:
          - all
          - espidf
          - arduino
      firmware_ref:
        description: 固件源码分支、标签或 commit
        required: true
        default: master
        type: string
      idf_target:
        description: ESP-IDF 构建目标
        required: true
        default: esp32
        type: choice
        options:
          - esp32
          - esp32c6
      idf_role:
        description: ESP-IDF 产品角色
        required: true
        default: device
        type: choice
        options:
          - device
          - hub
      idf_board:
        description: ESP-IDF 硬件板型，Hub 默认自动使用 C6 DevKitC-1
        required: true
        default: none
        type: choice
        options:
          - none
          - esp32-c6-devkitc-1
      idf_oled:
        description: 是否启用 SSD1306 OLED
        required: true
        default: false
        type: boolean
      idf_thread:
        description: Hub 是否启用 OpenThread
        required: true
        default: false
        type: boolean
      arduino_target:
        description: Arduino 构建目标
        required: true
        default: esp8266
        type: choice
        options:
          - esp8266
  pull_request:
    paths:
      - .github/workflows/firmware.yml
      - release.config
      - README.md
  push:
    branches:
      - main
      - master
    paths:
      - .github/workflows/firmware.yml
      - release.config
      - README.md

permissions:
  contents: write

env:
  FIRMWARE_REPO: ${{ vars.FIRMWARE_REPO || 'umud66/iot_common_firmare' }}
  FIRMWARE_REF: ${{ inputs.firmware_ref || 'master' }}
  SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN || github.token }}

jobs:
  esp-idf:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'espidf' }}
    name: Build ESP-IDF (${{ inputs.idf_target || 'esp32' }})
    runs-on: ubuntu-latest
    env:
      IDF_TARGET: ${{ inputs.idf_target || 'esp32' }}
      IDF_ROLE: ${{ inputs.idf_role || 'device' }}
      IDF_BOARD: ${{ inputs.idf_board || 'none' }}
      IDF_OLED: ${{ inputs.idf_oled || 'false' }}
      IDF_THREAD: ${{ inputs.idf_thread || 'false' }}
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ env.FIRMWARE_REF }}
          token: ${{ env.SOURCE_TOKEN }}
          path: sources/firmware
          fetch-depth: 1

      - name: Build ESP-IDF firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0.2
          target: ${{ env.IDF_TARGET }}
          path: sources/firmware/device
          command: >-
            set -euo pipefail;
            if [ "${IDF_ROLE}" = "hub" ] && [ "${IDF_TARGET}" != "esp32c6" ]; then
              echo "错误：Hub 只支持 esp32c6" >&2;
              exit 1;
            fi;
            if [ "${IDF_THREAD}" = "true" ] && [ "${IDF_ROLE}" != "hub" ]; then
              echo "错误：OpenThread 只支持 Hub" >&2;
              exit 1;
            fi;
            board="${IDF_BOARD}";
            if [ "${IDF_ROLE}" = "hub" ] && [ "${board}" = "none" ]; then
              board="esp32-c6-devkitc-1";
            fi;
            defaults="sdkconfig.defaults;sdkconfig.${IDF_ROLE}.defaults";
            if [ "${IDF_OLED}" = "true" ]; then
              defaults="${defaults};sdkconfig.oled.defaults";
            fi;
            if [ "${IDF_THREAD}" = "true" ]; then
              defaults="${defaults};sdkconfig.hub-thread.defaults";
            fi;
            if [ "${board}" != "none" ]; then
              defaults="${defaults};boards/${board}/sdkconfig.defaults";
            fi;
            echo "ESP-IDF defaults: ${defaults}";
            idf.py -B build
            -D SDKCONFIG=build/sdkconfig
            -D SDKCONFIG_DEFAULTS="${defaults}"
            build
          extra_docker_args: >-
            -e IDF_ROLE=${{ env.IDF_ROLE }}
            -e IDF_BOARD=${{ env.IDF_BOARD }}
            -e IDF_OLED=${{ env.IDF_OLED }}
            -e IDF_THREAD=${{ env.IDF_THREAD }}

      - name: Collect ESP-IDF artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="artifacts/esp-idf"
          build_dir="sources/firmware/device/build"
          mkdir -p "${artifact_dir}"
          firmware_name="commoniot-${IDF_TARGET}-${IDF_ROLE}"
          cp "${build_dir}/commoniot_device.bin" "${artifact_dir}/${firmware_name}.bin"
          cp "${build_dir}/bootloader/bootloader.bin" "${artifact_dir}/${firmware_name}-bootloader.bin"
          cp "${build_dir}/partition_table/partition-table.bin" "${artifact_dir}/${firmware_name}-partition-table.bin"
          cp "${build_dir}/flash_args" "${artifact_dir}/flash_args"
          {
            echo "target=${IDF_TARGET}"
            echo "role=${IDF_ROLE}"
            echo "board=${IDF_BOARD}"
            echo "oled=${IDF_OLED}"
            echo "thread=${IDF_THREAD}"
            echo "firmware_ref=${FIRMWARE_REF}"
          } > "${artifact_dir}/BUILD_CONFIG.txt"
          sha256sum "${artifact_dir}"/* > "${artifact_dir}/SHA256SUMS"

      - name: Upload ESP-IDF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp-idf-${{ env.IDF_TARGET }}-${{ env.IDF_ROLE }}
          path: artifacts/esp-idf
          if-no-files-found: error
          retention-days: 14

  esp8266-arduino:
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'arduino' }}
    name: Build Arduino (${{ inputs.arduino_target || 'esp8266' }})
    runs-on: ubuntu-latest
    env:
      ARDUINO_TARGET: ${{ inputs.arduino_target || 'esp8266' }}
    steps:
      - name: Checkout release repo
        uses: actions/checkout@v4

      - name: Checkout firmware source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.FIRMWARE_REPO }}
          ref: ${{ env.FIRMWARE_REF }}
          token: ${{ env.SOURCE_TOKEN }}
          path: sources/firmware
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            sources/tmp/platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('sources/firmware/device/platforms/arduino/esp8266/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build ESP8266 Arduino firmware
        run: >-
          pio run
          --project-dir sources/firmware/device/platforms/arduino/${ARDUINO_TARGET}
          --environment esp01_1m
          --environment esp01_1m_ota

      - name: Collect ESP8266 Arduino artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="artifacts/esp8266-arduino"
          build_dir="sources/tmp/platformio/${ARDUINO_TARGET}"
          mkdir -p "${artifact_dir}"
          cp "${build_dir}/esp01_1m/firmware.bin" "${artifact_dir}/commoniot-esp8266.bin"
          cp "${build_dir}/esp01_1m_ota/firmware.bin" "${artifact_dir}/commoniot-esp8266-ota.bin"
          sha256sum "${artifact_dir}"/* > "${artifact_dir}/SHA256SUMS"

      - name: Upload ESP8266 Arduino artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware-arduino-${{ env.ARDUINO_TARGET }}
          path: artifacts/esp8266-arduino
          if-no-files-found: error
          retention-days: 14

  publish-firmware-release:
    name: Publish firmware to GitHub Release
    needs:
      - esp-idf
      - esp8266-arduino
    if: >-
      ${{ always() && github.event_name == 'workflow_dispatch' && inputs.version != '' &&
          (needs['esp-idf'].result == 'success' || needs['esp8266-arduino'].result == 'success') &&
          needs['esp-idf'].result != 'failure' && needs['esp-idf'].result != 'cancelled' &&
          needs['esp8266-arduino'].result != 'failure' && needs['esp8266-arduino'].result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist/firmware
          merge-multiple: false

      - name: Verify firmware bin files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t firmware_bins < <(find dist/firmware -type f -name '*.bin' -print)
          if (( ${#firmware_bins[@]} == 0 )); then
            echo "没有找到固件 bin 文件，停止发布" >&2
            exit 1
          fi
          release_dir="dist/firmware-release"
          mkdir -p "${release_dir}"
          for firmware_bin in "${firmware_bins[@]}"; do
            cp "${firmware_bin}" "${release_dir}/$(basename "${firmware_bin}")"
          done
          printf '待发布固件：%s\n' "${release_dir}"/*.bin

      - name: Publish firmware bin files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: CommonIOT Firmware ${{ inputs.version }}
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/firmware-release/*.bin
